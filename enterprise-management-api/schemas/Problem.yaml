ProblemGeneric:
  type: object
  properties:
    type:
      type: string
      format: uri
      description: |
        An absolute URI that identifies the problem type. When dereferenced,
        it SHOULD provide human-readable documentation for the problem type
        (e.g., using HTML).
      default: about:blank
      example: https://your.api.documentation.url
    title:
      type: string
      description: |
        A short, summary of the problem type. Written in english and readable
        for engineers (usually not suited for non technical stakeholders and
        not localized);
      example: Service Unavailable
    status:
      type: integer
      format: int32
      description: |
        The HTTP status code generated by the origin server for this occurrence
        of the problem.
      minimum: 100
      maximum: 600
      example: 503
    detail:
      type: string
      description: |
        A human readable explanation specific to this occurrence of the
        problem.
      example: Connection to database timed out
    instance:
      type: string
      description: |
        An absolute URI that identifies the specific occurrence of the problem.
        It may or may not yield further information if dereferenced.
      default: about:blank
      example: /iot/api/problems/123e4567-e89b-12d3-a456-426614174000
Problem:
  type: object
  properties:
    type:
      type: string
      format: uri
      description: "An absolute URI that identifies the problem type.\n        When dereferenced,it SHOULD provide\nhuman-readable documentation\n        for the problem type (e.g., using HTML).\n"
      default: 'about:blank'
      example: 'http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html#sec10.5.4'
    title:
      type: string
      description: "A short, summary of the problem type. Written in\n        english and readable for engineers (usually not suited\nfor non\n        technical stakeholders and not localized.\n"
      example: 'Service Unavailable'
    status:
      type: integer
      format: int32
      description: 'The HTTP status code generated by the origin server\n        for this occurrence of the problem.'
      minimum: 100
      maximum: 600
      exclusiveMaximum: true
      example: 503
    detail:
      type: string
      description: 'A human readable explanation specific to this\n        occurrence of the problem.'
      example: 'Connection to database timed out.'
    instance:
      type: string
      description: 'An absolute URI that identifies the specific\n        occurrence of the problem. It may or may not yield further\n        information if dereferenced.'
      example: 'https://api.documentation.url/request-id'
