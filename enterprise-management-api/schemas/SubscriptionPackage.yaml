Offers:
  type: object
  properties:
    offers:
      type: array
      maxItems: 50
      items:
        $ref: '#/components/schemas/Offer'
Offer:
  type: object
  allOf:
    - $ref: '#/components/schemas/BasicData'
    - properties:
        sim_specifications:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SimSpecification'
        form_specifications:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/FormSpecification'
        profile_specifications:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProfileSpecification'
        network_groups:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/BasicData'
        sp_templates:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TemplateSubscriptionPackage'
        price:
          $ref: '#/components/schemas/price'
        order_limit:
          type: integer
          format: int64
        tsp_price_profile_linkage:
          $ref: '#/components/schemas/TpsPriceMap'
price:
  type: object
  properties:
    plan_id:
      type: string
      maxLength: 50
      example: PP123456789
    description:
      type: string
      nullable: true
      maxLength: 255
      example: 'My Price Highlights'
    profile_ids:
      type: string
      maxLength: 255
      example: 'profileid1,profileid2'
    plan_name:
      type: string
      maxLength: 255
      example: 'My Price Plan'
TpsPriceMap:
  type: object
  additionalProperties:
    type: string
    description: 'Mapping of SP Template name to Price Profile Name'
  example:
    TPS Example-1: 'Example Price Profile Name'
    TPS Example-2: 'Example Price Profile Name'
TemplateSubscriptionPackage:
  type: object
  allOf:
    - $ref: '#/components/schemas/BasicData'
    - $ref: '#/components/schemas/SubscriptionPackageBase'
CamelProfile:
  type: object
  allOf:
    - $ref: '#/components/schemas/BasicData'
    - properties:
        camel_profile_id:
          type: integer
          maximum: 8160
          example: 5005
      required:
        - camel_profile_id
